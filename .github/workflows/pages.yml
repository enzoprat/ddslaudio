name: Aperçu client (GitHub Pages)

# Publie une version statique du site sur GitHub Pages, uniquement pour montrer
# le rendu au client. Cette version n'envoie aucune demande de devis :
# la route /api/devis n'existe pas dans un export statique.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # L'export statique n'accepte pas de route handler POST.
      - name: Retirer les routes serveur
        run: rm -rf src/app/api

      - name: Build statique
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_DEMO: "1"
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      # Sans ce fichier, GitHub Pages passe la sortie dans Jekyll et ignore
      # les dossiers commençant par « _ » (dont _next).
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
